<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub copilot make Icon Tooltip</title>
   <style>
    body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background-color: #f0f0f0;
}

.icon-container {
    position: relative;
}

.icon {
    position: relative;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background-color: black;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: background-color 0.3s ease;
}

.icon img {
    width: 60%;
    height: 60%;
    filter: invert(1);
}

.icon:hover {
    background-color: white;
}

.icon:hover img {
    filter: invert(0);
}

.tooltip {
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    background-color: black;
    color: white;
    padding: 5px 10px;
    border-radius: 5px;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease, visibility 0.3s ease;
    white-space: nowrap;
}

.icon:hover .tooltip {
    opacity: 1;
    visibility: visible;
}
   </style>
</head>
<body>
    <div class="icon-container">
        <div class="icon">
            <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" alt="GitHub Logo">
            <span class="tooltip">GitHub</span>
        </div>
    </div>
</body>
</html>
