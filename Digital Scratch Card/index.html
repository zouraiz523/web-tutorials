<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Weather Widget</title>
    <link rel="stylesheet" href="styles.css">
</head> 
<body>
    <div class="container">
        <h1>Scratch to Reveal Your Discount!</h1>
        <p>Use your cursor or finger on mobile to scratch the card and reveal your special coupon code.</p>
        
        <div class="scratch-container">
          <div class="coupon-code">SAVE25NOW</div>
          <div class="scratch-text">Scratch Here!</div>
          <canvas id="scratch-card" width="300" height="150"></canvas>
        </div>
        
        <div class="progress">
          <div class="progress-bar" id="scratch-progress"></div>
        </div>
        
        <button class="reset-btn" id="reset-btn">Reset Card</button>
      </div>
    
     

    <script src="main.js"></script>
</body>
</html>
