<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card </title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
</head>
<body>
    
    <div class="container">
        <h1 class="title">CSS Card</h1>
        <h2 class="subtitle">Hover Effects</h2>
        
        <div class="cards-container">
            <div class="card">
                <img src="1.png" alt="Misty forest with a river flowing through mountains">
                <div class="card-content">
                    <p class="location">Vancouver Mountains, Canada</p>
                    <h3 class="title-card">The Great Path</h3>
                </div>
            </div>
            
            <div class="card">
                <img src="2.png" alt="Mountain peak against clear blue sky">
                <div class="card-content">
                    <p class="location">Poon Hill, Nepal</p>
                    <h3 class="title-card">Starry Night</h3>
                    <a href="#" class="card-button">Read More</a>
                </div>
            </div>
            
            <div class="card">
                <img src="3.png" alt="Misty forest with light filtering through trees">
                <div class="card-content">
                    <p class="location">Black Forest, Germany</p>
                    <h3 class="title-card">Mystical Woods</h3>
                </div>
            </div>
        </div>
        
        <div class="annotation">
            <span>Inside</span>
            <svg class="arrow" viewBox="0 0 100 50" xmlns="http://www.w3.org/2000/svg">
                <path d="M10,25 Q40,45 70,25 L90,25" fill="none" stroke="#464f3e" stroke-width="3"/>
                <polygon points="85,21 95,25 85,29" fill="#464f3e"/>
            </svg>
            <span>Outside</span>
        </div>
    </div>

  
</body>
</html>
